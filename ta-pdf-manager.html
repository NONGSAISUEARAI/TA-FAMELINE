<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TA PDF Manager</title>
  <style>
    :root{--ink:#14213d;--line:#d9e1eb;--paper:#f6f8fb;--accent:#e66b38;--navy:#13233d;--muted:#60708b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}main{max-width:1400px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;padding:24px;color:#fff;background:var(--navy);border-radius:16px}h1{margin:4px 0;font-size:38px}h2{margin:4px 0}.eyebrow{font-size:11px;font-weight:bold;letter-spacing:.13em;color:#eb9978}.tagline,.note{color:var(--muted);font-size:13px;line-height:1.45}.tagline{max-width:850px;color:#dbe4f3}button,.file-label{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;border:0;border-radius:8px;font-weight:bold;font-size:13px;cursor:pointer}.run{background:var(--accent);color:#fff}.secondary,.file-label{background:#fff;color:var(--navy);border:1px solid var(--line)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.card{margin-top:14px;padding:16px;background:#fff;border:1px solid var(--line);border-radius:12px}.drop{display:grid;place-items:center;min-height:145px;border:2px dashed #bac8d8;border-radius:10px;text-align:center;transition:.15s}.drop.drag{border-color:var(--accent);background:#fff5f1}.drop b{display:block;font-size:16px;margin-bottom:6px}input[type=file]{display:none}.status{min-height:20px;margin-top:12px;color:var(--muted);font-size:13px}.error{color:#a13d16}.result-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:22px 0 10px}.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}.page{position:relative;padding:9px;background:#fff;border:1px solid var(--line);border-radius:10px;cursor:grab;box-shadow:0 2px 5px #14213d0b}.page.selected{border-color:var(--accent);box-shadow:0 0 0 2px #e66b3830}.page.dragging{opacity:.35}.page.over{outline:2px solid var(--accent)}.thumb{display:grid;place-items:center;aspect-ratio:.707;background:#eef2f7;border-radius:5px;overflow:hidden}.thumb canvas{width:100%;height:100%;object-fit:contain}.placeholder{padding:12px;color:var(--muted);font-size:12px;text-align:center}.meta{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-top:8px;font-size:12px;font-weight:bold}.check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}.delete{width:25px;height:25px;padding:0;color:#a13d16;background:#fff0eb;border-radius:50%;font-size:17px;line-height:1}@media(max-width:700px){main{padding:14px}header{align-items:start;flex-direction:column}h1{font-size:30px}.pages{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body><main>
  <header><div><div class="eyebrow">TA COMPLETE / PDF TOOL</div><h1>PDF Manager</h1><div class="tagline">เรียงหน้า ลบหน้า เพิ่มหน้า และแยกหน้าที่เลือกเป็น PDF ใหม่ได้ในเบราว์เซอร์ของคุณ</div></div><div class="toolbar"><button class="secondary" onclick="addBlank()">+ Blank Page</button><button class="secondary" onclick="extractPdf()">Extract Selected</button><button class="run" onclick="downloadPdf()">Download PDF</button></div></header>
  <section class="card"><div id="drop" class="drop"><div><b>Drop PDF here</b><span class="note">หรือเลือกไฟล์หลักเพื่อเริ่มจัดการหน้า</span><br><label class="file-label" style="margin-top:12px">Choose PDF<input id="mainFile" type="file" accept="application/pdf"></label></div></div><div class="status" id="status">ยังไม่ได้เลือกไฟล์</div></section>
  <section class="card"><div class="result-head"><div><div class="eyebrow">PAGES</div><h2 id="pageTitle">0 pages</h2></div><label class="file-label">+ Add pages from PDF<input id="addFile" type="file" accept="application/pdf" multiple></label></div><div id="pages" class="pages"></div></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
  const $=id=>document.getElementById(id);let pdfDoc=null,sourceBytes=null,pages=[],dragIndex=null;
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const say=(text,bad=false)=>$('status').innerHTML=`<span class="${bad?'error':''}">${text}</span>`;
  $('mainFile').onchange=e=>loadMain(e.target.files[0]);$('addFile').onchange=e=>addFiles([...e.target.files]);
  ['dragover','drop'].forEach(type=>$('drop').addEventListener(type,e=>e.preventDefault()));
  $('drop').addEventListener('dragover',()=>$('drop').classList.add('drag'));
  $('drop').addEventListener('dragleave',()=>$('drop').classList.remove('drag'));
  $('drop').addEventListener('drop',e=>{ $('drop').classList.remove('drag');loadMain([...e.dataTransfer.files].find(f=>f.type==='application/pdf')); });
  async function loadMain(file){if(!file)return;say('Loading PDF...');try{sourceBytes=await file.arrayBuffer();pdfDoc=await pdfjsLib.getDocument({data:sourceBytes.slice(0)}).promise;pages=Array.from({length:pdfDoc.numPages},(_,i)=>({type:'source',index:i}));$('drop').innerHTML=`<div><b>${esc(file.name)}</b><span class="note"> · ${pdfDoc.numPages} pages</span><br><label class="file-label" style="margin-top:12px">Change PDF<input id="mainFile" type="file" accept="application/pdf"></label></div>`;$('mainFile').onchange=e=>loadMain(e.target.files[0]);say('Drag cards to reorder. Use × to delete a page.');render()}catch(e){say(`Could not open PDF: ${esc(e.message)}`,true)}}
  async function addFiles(files){if(!pdfDoc||!files.length)return say('Select the main PDF first.',true);say('Adding pages...');try{for(const file of files){const bytes=await file.arrayBuffer(),doc=await pdfjsLib.getDocument({data:bytes}).promise;for(let i=0;i<doc.numPages;i++)pages.push({type:'extra',doc,index:i,name:file.name})}say(`Added ${files.length} PDF file(s).`);render()}catch(e){say(`Could not add PDF: ${esc(e.message)}`,true)}}
  function addBlank(){if(!pdfDoc)return say('Select the main PDF first.',true);pages.push({type:'blank'});render();say('Blank page added.');}
  async function render(){const box=$('pages');$('pageTitle').textContent=`${pages.length} page${pages.length===1?'':'s'}`;box.innerHTML='';for(let i=0;i<pages.length;i++){const item=pages[i],card=document.createElement('article');card.className=`page${item.selected?' selected':''}`;card.draggable=true;card.dataset.i=i;card.innerHTML=`<div class="thumb"><span class="placeholder">${item.type==='blank'?'Blank page':'Loading preview...'}</span></div><div class="meta"><label title="Select for extract"><input class="check" type="checkbox" ${item.selected?'checked':''}> Page ${i+1}</label><button class="delete" title="Delete page">×</button></div>`;card.querySelector('.check').onchange=e=>{item.selected=e.target.checked;card.classList.toggle('selected',item.selected)};card.querySelector('.delete').onclick=()=>{pages.splice(i,1);render()};card.ondragstart=()=>{dragIndex=i;card.classList.add('dragging')};card.ondragend=()=>card.classList.remove('dragging');card.ondragover=e=>{e.preventDefault();card.classList.add('over')};card.ondragleave=()=>card.classList.remove('over');card.ondrop=e=>{e.preventDefault();card.classList.remove('over');if(dragIndex===null||dragIndex===i)return;const moved=pages.splice(dragIndex,1)[0];pages.splice(i,0,moved);dragIndex=null;render()};box.append(card);if(item.type!=='blank')preview(item,card.querySelector('.thumb'))}}
  async function preview(item,holder){try{const doc=item.type==='source'?pdfDoc:item.doc,page=await doc.getPage(item.index+1),view=page.getViewport({scale:.36}),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=view.width;canvas.height=view.height;await page.render({canvasContext:ctx,viewport:view}).promise;holder.replaceChildren(canvas)}catch{holder.innerHTML='<span class="placeholder">Preview unavailable</span>'}}
  async function downloadPdf(){if(!pdfDoc||!pages.length)return say('There are no pages to export.',true);try{say('Building PDF...');const out=await PDFLib.PDFDocument.create(),main=await PDFLib.PDFDocument.load(sourceBytes);const extraCache=new Map;for(const item of pages){if(item.type==='blank'){out.addPage([595.28,841.89]);continue}let donor;if(item.type==='source')donor=main;else{if(!extraCache.has(item.doc))extraCache.set(item.doc,await PDFLib.PDFDocument.load(await item.doc.getData()));donor=extraCache.get(item.doc)}const [copied]=await out.copyPages(donor,[item.index]);out.addPage(copied)}const blob=new Blob([await out.save()],{type:'application/pdf'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pdf-manager-result.pdf';a.click();URL.revokeObjectURL(a.href);say('PDF downloaded.')}catch(e){say(`Export failed: ${esc(e.message)}`,true)}}
  async function extractPdf(){const selected=pages.filter(item=>item.selected);if(!selected.length)return say('Tick the pages to extract first.',true);const allPages=pages;pages=selected;try{await downloadPdf();say(`Extracted ${selected.length} page(s).`)}finally{pages=allPages}}
  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
